name: Sync calendars

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create data file
        run: |
          mkdir -p data
          echo "[]" > data/reservations.json

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/reservations.json
          git commit -m "Update reservations" || echo "No changes"
          git push
