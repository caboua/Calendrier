name: Sync calendars

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Snapshot current data (avant synchro)
        run: |
          mkdir -p .prevdata
          cp data/reservations.json .prevdata/ 2>/dev/null || true
          cp data/annulations.json .prevdata/ 2>/dev/null || true

      - name: Sync Airbnb and Booking iCal calendars
        run: npm run sync:ical
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}

      - name: Sync Airbnb and Booking reservation details from Gmail
        run: npm run sync:gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SINCE: "2026-01-01T00:00:00Z"

      - name: Commit updated reservations
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/reservations.json data/reservations_details.json data/annulations.json
          git commit -m "Update reservations" || echo "No changes"
          git push

      - name: Notifier les nouveautes (iPhone via ntfy)
        if: ${{ always() }}
        run: node scripts/notify-changes.js
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
