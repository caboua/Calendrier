name: Sync calendars

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install node-ical

      - name: Sync Airbnb and Booking calendars
        run: |
          mkdir -p data
          node <<'EOF'
          const ical = require("node-ical");
          const fs = require("fs");

          const calendars = [
            { source: "Airbnb", url: process.env.AIRBNB_ICAL_URL },
            { source: "Booking", url: process.env.BOOKING_ICAL_URL }
          ];

          async function main() {
            const reservations = [];

            for (const cal of calendars) {
              if (!cal.url) continue;

              const events = await ical.async.fromURL(cal.url);

              for (const key in events) {
                const event = events[key];

                if (event.type === "VEVENT" && event.start && event.end) {
                  reservations.push({
                    source: cal.source,
                    title: "Réservé",
                    start: event.start.toISOString().split("T")[0],
                    end: event.end.toISOString().split("T")[0]
                  });
                }
              }
            }

            reservations.sort((a, b) => a.start.localeCompare(b.start));

            fs.writeFileSync(
              "data/reservations.json",
              JSON.stringify(reservations, null, 2)
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}

      - name: Commit updated reservations
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/reservations.json
          git commit -m "Update reservations" || echo "No changes"
          git push
